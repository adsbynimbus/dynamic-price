version: 2

registries:
  github-maven:
    type: maven-repository
    url: https://maven.pkg.github.com
    username: ${{ secrets.USER }}
    password: ${{ secrets.GHP }}

multi-ecosystem-groups:
  ads:
    schedule:
      interval: "daily"

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gradle"
    directory: "/"
    registries: "*"
    multi-ecosystem-group: "ads"
    patterns:
      - "com.adsbynimbus*"
      - "com.amazon*"
      - "*play-services-ads"
      - "*ads-mobile-sdk"
      - "com.iabtcf*"

  - package-ecosystem: "gradle"
    directory: "/"
    registries: "*"
    schedule:
      interval: "weekly"
    groups:
      build:
        patterns:
          - "com.android.library"
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.dokka"
          - "com.google.devtools.ksp"
      app:
        patterns:
          - "org.jetbrains.compose*"
          - "androidx.*"
          - "*compose"
      test:
        patterns:
          - "org.jetbrains.*"
          - "io.kotest*"
          - "io.mockk*"
      libs:
        patterns:
          - "*"
    ignore:
      - dependency-name: "org.jetbrains.compose.material3:material3"
      - dependency-name: "com.google.protobuf:protobuf-javalite"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "swift"
    directory: "/"
    multi-ecosystem-group: "ads"
    patterns: ["*"]
